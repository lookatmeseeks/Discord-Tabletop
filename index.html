<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabletop</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #202225;
            font-family: Arial, sans-serif;
        }

        #status {
            position: fixed;
            z-index: 100;
            top: 10px;
            left: 10px;
            padding: 6px 10px;
            border-radius: 6px;
            background: rgba(0,0,0,.65);
            color: white;
            font-size: 13px;
            pointer-events: none;
        }

        #board {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #35513f;
            cursor: default;
            touch-action: none;
        }

        #world {
            position: absolute;
            left: 0;
            top: 0;
            width: 50000px;
            height: 50000px;
            transform-origin: 0 0;
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 40px),
                repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 1px, transparent 1px 40px),
                #35513f;
        }

        #board.panning {
            cursor: grabbing;
        }

        .object {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            user-select: none;
            touch-action: none;
            box-sizing: border-box;
        }

        .object:active {
            cursor: grabbing;
        }

        .object.rectangle {
            background: rgba(20, 20, 20, .28);
            border: 2px solid rgba(255, 255, 255, .55);
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
            background-clip: padding-box;
        }

        .object.rectangle.has-texture {
            background-color: transparent;
        }

        .object.selected {
            outline: 3px solid #fff;
            outline-offset: 3px;
        }

        .lock-toggle {
            position: absolute;
            top: -9px;
            left: -9px;
            width: 18px;
            height: 18px;
            margin: 0;
            cursor: pointer;
            z-index: 3;
        }

        .resize-handle {
            position: absolute;
            right: -7px;
            bottom: -7px;
            width: 14px;
            height: 14px;
            box-sizing: border-box;
            border: 2px solid #fff;
            border-radius: 3px;
            background: #333;
            cursor: nwse-resize;
            z-index: 2;
        }

        .rotate-handle {
            position: absolute;
            left: 50%;
            top: -31px;
            width: 16px;
            height: 16px;
            box-sizing: border-box;
            transform: translateX(-50%);
            border: 2px solid #fff;
            border-radius: 50%;
            background: #333;
            cursor: grab;
            z-index: 3;
        }

        .rotate-handle::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 14px;
            width: 2px;
            height: 13px;
            transform: translateX(-50%);
            background: #fff;
        }

        #toolbar {
            position: fixed;
            z-index: 110;
            left: 10px;
            top: 45px;
        }

        #addRectangle {
            padding: 8px 12px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        #assets {
            position: fixed;
            z-index: 110;
            right: 10px;
            top: 10px;
            width: 220px;
            max-height: calc(100vh - 20px);
            overflow: auto;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 8px;
            background: rgba(0,0,0,.78);
            color: white;
        }

        #assets h3 {
            margin: 0 0 8px;
            font-size: 14px;
        }

        #assetHint {
            margin-bottom: 8px;
            font-size: 12px;
            opacity: .8;
        }

        .asset-folder {
            margin-top: 10px;
            font-size: 12px;
            opacity: .7;
        }

        .asset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 5px;
        }

        .asset {
            width: 100%;
            aspect-ratio: 1;
            padding: 0;
            border: 1px solid #555;
            border-radius: 4px;
            background: #333;
            overflow: hidden;
            cursor: pointer;
        }

        .asset img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

    </style>
</head>

<body>
    <div id="status">Connecting…</div>
    <div id="toolbar"><button id="addRectangle">Add frame</button> <button id="saveBoard">Save</button> <button id="deleteRectangle">Delete frame</button> <button id="sendBackground">Background</button> <button id="sendForeground">Foreground</button></div>
    <div id="assets">
        <h3>Assets</h3>
        <div id="assetHint">Select a frame, then click an image.</div>
        <div id="assetList">Loading…</div>
    </div>
    <div id="board"><div id="world"></div></div>

    <script type="module">
        const CLIENT_ID = "1551720640329814118";
        const DIRECT_WORKER_URL = "wss://discord-tabletop.animeister86.workers.dev/websocket";
        const ACTIVITY_PROXY_PATH = "/sync/websocket";

        const status = document.getElementById("status");
        const board = document.getElementById("board");
        const world = document.getElementById("world");

        const WORLD_SIZE = 50000;
        let cameraX = 0;
        let cameraY = 0;
        let zoom = 1;
        let panning = null;

        let socket = null;
        let draggingObject = null;
        let resizingObject = null;
        let rotatingObject = null;
        let selectedObjectId = null;
        let lastSent = 0;

        const addRectangleButton = document.getElementById("addRectangle");
        const deleteRectangleButton = document.getElementById("deleteRectangle");
        const sendBackgroundButton = document.getElementById("sendBackground");
        const sendForegroundButton = document.getElementById("sendForeground");
        const saveBoardButton = document.getElementById("saveBoard");

        function setStatus(text) {
            status.textContent = text;
        }

        function renderObject(object) {
            let element = document.querySelector(`.object[data-object="${object.id}"]`);

            if (!element) {
                element = document.createElement("div");
                element.className = "object";
                element.dataset.object = object.id;
                world.appendChild(element);
            }

            element.className = `object ${object.type}${selectedObjectId === object.id ? " selected" : ""}`;
            element.style.left = `${object.x}%`;
            element.style.top = `${object.y}%`;
            element.style.width = object.width ? `${object.width}px` : "";
            element.style.height = object.height ? `${object.height}px` : "";
            element.style.transform = `translate(-50%, -50%) rotate(${Number(object.rotation) || 0}deg)`;
            element.style.transformOrigin = "center";
            element.style.zIndex = object.layer === "background" ? "0" : "1";

            element.replaceChildren();
            element.style.backgroundImage = "";
            element.style.backgroundSize = "100% 100%";
            element.classList.toggle("has-texture", Boolean(object.texture));

            if (object.type === "rectangle") {
                if (object.texture) {
                    element.style.backgroundImage = `url("${object.texture}")`;
                    element.style.backgroundRepeat = "no-repeat";
                }
                if (selectedObjectId === object.id) {
                    const lock = document.createElement("input");
                    lock.type = "checkbox";
                    lock.className = "lock-toggle";
                    lock.checked = Boolean(object.locked);
                    lock.title = "Lock frame";
                    lock.setAttribute("aria-label", "Lock frame");
                    lock.onpointerdown = event => event.stopPropagation();
                    lock.onchange = event => {
                        object.locked = event.target.checked;
                        if (socket && socket.readyState === WebSocket.OPEN) {
                            socket.send(JSON.stringify({
                                type: "lock",
                                objectId: object.id,
                                locked: object.locked
                            }));
                        }
                    };
                    element.appendChild(lock);

                    const rotateHandle = document.createElement("div");
                    rotateHandle.className = "rotate-handle";
                    rotateHandle.title = "Rotate frame";
                    rotateHandle.setAttribute("aria-label", "Rotate frame");
                    rotateHandle.onpointerdown = event => startRotation(event, object, element);
                    element.appendChild(rotateHandle);

                    const handle = document.createElement("div");
                    handle.className = "resize-handle";
                    handle.onpointerdown = event => startResize(event, object, element);
                    element.appendChild(handle);
                }
            }

            attachDragHandlers(element, object.id);
        }

        function updateCamera() {
            const rect = board.getBoundingClientRect();
            const scaledWorldWidth = WORLD_SIZE * zoom;
            const scaledWorldHeight = WORLD_SIZE * zoom;

            const minX = Math.min(0, rect.width - scaledWorldWidth);
            const minY = Math.min(0, rect.height - scaledWorldHeight);
            cameraX = Math.min(0, Math.max(minX, cameraX));
            cameraY = Math.min(0, Math.max(minY, cameraY));

            world.style.transform = `translate(${cameraX}px, ${cameraY}px) scale(${zoom})`;
        }

        function centerWorld() {
            const rect = board.getBoundingClientRect();
            cameraX = (rect.width - WORLD_SIZE * zoom) / 2;
            cameraY = (rect.height - WORLD_SIZE * zoom) / 2;
            updateCamera();
        }

        function renderState(state) {
            const objects = (state.objects || []).filter(object => object.type === "rectangle");
            const ids = new Set(objects.map(object => object.id));

            for (const element of board.querySelectorAll(".object")) {
                if (!ids.has(element.dataset.object)) {
                    element.remove();
                }
            }

            for (const object of objects) {
                renderObject(object);
            }
        }

        function sendMove(id, x, y) {
            if (!socket || socket.readyState !== WebSocket.OPEN) return;

            socket.send(JSON.stringify({
                type: "move",
                objectId: id,
                x,
                y
            }));
        }

        function startResize(event, object, element) {
            if (object.locked) return;
            event.preventDefault();
            event.stopPropagation();

            if (resizingObject) finishResize();

            resizingObject = {
                object,
                element,
                pointerId: event.pointerId,
                startX: event.clientX,
                startWidth: object.width,
                ratio: object.aspectRatio || (object.width / object.height)
            };

            board.setPointerCapture(event.pointerId);
            window.addEventListener("pointermove", handleResizeMove);
            window.addEventListener("pointerup", finishResize);
            window.addEventListener("pointercancel", finishResize);
        }

        function handleResizeMove(event) {
            if (!resizingObject || resizingObject.pointerId !== event.pointerId) return;

            event.preventDefault();

            const delta = event.clientX - resizingObject.startX;
            const width = Math.max(30, resizingObject.startWidth + delta);
            const height = width / resizingObject.ratio;

            resizingObject.object.width = width;
            resizingObject.object.height = height;
            resizingObject.element.style.width = width + "px";
            resizingObject.element.style.height = height + "px";

            sendResize(resizingObject.object.id, width, height);
        }

        function finishResize(event) {
            if (!resizingObject) return;
            if (event && event.pointerId !== undefined && resizingObject.pointerId !== event.pointerId) return;

            const resizeState = resizingObject;
            const object = resizeState.object;

            window.removeEventListener("pointermove", handleResizeMove);
            window.removeEventListener("pointerup", finishResize);
            window.removeEventListener("pointercancel", finishResize);

            if (board.hasPointerCapture(resizeState.pointerId)) {
                board.releasePointerCapture(resizeState.pointerId);
            }

            sendResize(object.id, object.width, object.height);
            resizingObject = null;
            renderState(window.currentState);
        }

        function sendResize(id, width, height) {
            if (!socket || socket.readyState !== WebSocket.OPEN) return;
            socket.send(JSON.stringify({ type: "resize", objectId: id, width, height }));
        }

        function getPointerRotation(event, element) {
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            return Math.atan2(event.clientY - centerY, event.clientX - centerX) * 180 / Math.PI + 90;
        }

        function startRotation(event, object, element) {
            if (object.locked) return;
            event.preventDefault();
            event.stopPropagation();

            if (resizingObject) finishResize();
            if (rotatingObject) finishRotation();

            rotatingObject = {
                object,
                element,
                pointerId: event.pointerId,
                offset: getPointerRotation(event, element) - (Number(object.rotation) || 0)
            };

            element.setPointerCapture(event.pointerId);
            window.addEventListener("pointermove", handleRotationMove);
            window.addEventListener("pointerup", finishRotation);
            window.addEventListener("pointercancel", finishRotation);
        }

        function handleRotationMove(event) {
            if (!rotatingObject || rotatingObject.pointerId !== event.pointerId) return;
            event.preventDefault();

            const rotation = getPointerRotation(event, rotatingObject.element) - rotatingObject.offset;
            const normalized = ((rotation % 360) + 360) % 360;
            rotatingObject.object.rotation = normalized;
            rotatingObject.element.style.transform = `translate(-50%, -50%) rotate(${normalized}deg)`;

            const now = performance.now();
            if (now - lastSent >= 40) {
                lastSent = now;
                sendRotation(rotatingObject.object.id, normalized);
            }
        }

        function finishRotation(event) {
            if (!rotatingObject) return;
            if (event && event.pointerId !== undefined && rotatingObject.pointerId !== event.pointerId) return;

            const rotationState = rotatingObject;
            const object = rotationState.object;

            window.removeEventListener("pointermove", handleRotationMove);
            window.removeEventListener("pointerup", finishRotation);
            window.removeEventListener("pointercancel", finishRotation);

            if (rotationState.element.hasPointerCapture(rotationState.pointerId)) {
                rotationState.element.releasePointerCapture(rotationState.pointerId);
            }

            sendRotation(object.id, object.rotation || 0);
            rotatingObject = null;
            renderState(window.currentState);
        }

        function sendRotation(id, rotation) {
            if (!socket || socket.readyState !== WebSocket.OPEN) return;
            socket.send(JSON.stringify({ type: "rotate", objectId: id, rotation }));
        }

        function attachDragHandlers(element, objectId) {
            element.onpointerdown = event => {
                if (event.button === 1) return;
                if (event.target.classList.contains("resize-handle")) return;

                const object = window.currentState?.objects?.find(item => item.id === objectId);
                if (!object) return;

                selectedObjectId = objectId;
                renderObject(object);

                if (object.locked) return;

                const startX = object.x;
                const startY = object.y;

                draggingObject = {
                    element,
                    pointerId: event.pointerId,
                    id: objectId,
                    startClientX: event.clientX,
                    startClientY: event.clientY,
                    startX,
                    startY
                };
                element.setPointerCapture(event.pointerId);
            };

            element.onpointermove = event => {
                if (!draggingObject || draggingObject.pointerId !== event.pointerId) return;
                const deltaX = ((event.clientX - draggingObject.startClientX) / zoom) / WORLD_SIZE * 100;
                const deltaY = ((event.clientY - draggingObject.startClientY) / zoom) / WORLD_SIZE * 100;
                const x = Math.max(0, Math.min(100, draggingObject.startX + deltaX));
                const y = Math.max(0, Math.min(100, draggingObject.startY + deltaY));
                element.style.left = x + "%";
                element.style.top = y + "%";
                const object = window.currentState?.objects?.find(item => item.id === objectId);
                if (object) {
                    object.x = x;
                    object.y = y;
                }
                const now = performance.now();
                if (now - lastSent >= 40) { lastSent = now; sendMove(objectId, x, y); }
            };

            element.onpointerup = event => {
                if (!draggingObject || draggingObject.pointerId !== event.pointerId) return;
                const deltaX = ((event.clientX - draggingObject.startClientX) / zoom) / WORLD_SIZE * 100;
                const deltaY = ((event.clientY - draggingObject.startClientY) / zoom) / WORLD_SIZE * 100;
                const x = Math.max(0, Math.min(100, draggingObject.startX + deltaX));
                const y = Math.max(0, Math.min(100, draggingObject.startY + deltaY));
                sendMove(objectId, x, y);
                draggingObject = null;
            };
            element.onpointercancel = () => { draggingObject = null; };
        }

        function setSelectedLayer(layer) {
            if (!selectedObjectId) return;

            const object = window.currentState?.objects?.find(item => item.id === selectedObjectId);
            if (!object || object.type !== "rectangle" || object.layer === layer) return;

            object.layer = layer;
            renderState(window.currentState);

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: "layer",
                    objectId: object.id,
                    layer
                }));
            }
        }

        function deleteSelectedRectangle() {
            if (!selectedObjectId) return;

            const objectId = selectedObjectId;
            const object = window.currentState?.objects?.find(item => item.id === objectId);
            if (!object || object.type !== "rectangle") return;

            window.currentState.objects = window.currentState.objects.filter(item => item.id !== objectId);
            selectedObjectId = null;
            renderState(window.currentState);

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: "delete",
                    objectId
                }));
                setStatus("Frame deleted");
            } else {
                setStatus("Frame deleted locally — multiplayer not connected");
            }
        }

        function addRectangle() {
            const object = {
                id: "local-rectangle-" + crypto.randomUUID(),
                type: "rectangle",
                x: 50,
                y: 50,
                width: 200,
                height: 120,
                layer: "foreground",
                rotation: 0
            };

            if (!window.currentState) {
                window.currentState = { version: 3, objects: [] };
            }

            window.currentState.objects.push(object);
            selectedObjectId = object.id;
            renderState(window.currentState);

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: "addRectangle",
                    objectId: object.id,
                    x: object.x,
                    y: object.y,
                    width: object.width,
                    height: object.height
                }));
                setStatus("Frame added");
            } else {
                setStatus("Frame added locally — multiplayer not connected");
            }
        }
        async function loadAssets() {
            const list = document.getElementById("assetList");
            list.textContent = "";
            try {
                const response = await fetch("assets/manifest.json", { cache: "no-store" });
                if (!response.ok) throw new Error("HTTP " + response.status);
                const manifest = await response.json();
                const files = Array.isArray(manifest.assets) ? manifest.assets : [];
                if (!files.length) { list.textContent = "No images found in assets."; return; }
                const grid = document.createElement("div");
                grid.className = "asset-grid";
                for (const path of files) {
                    const button = document.createElement("button");
                    button.className = "asset";
                    button.title = path.split("/").pop();
                    const image = document.createElement("img");
                    image.src = path;
                    image.alt = button.title;
                    button.appendChild(image);
                    button.onclick = () => applyAsset(path);
                    grid.appendChild(button);
                }
                list.appendChild(grid);
            } catch (error) {
                console.error("Could not load asset manifest", error);
                list.textContent = "Could not load assets.";
            }
        }

        function applyAsset(path) {
            if (!selectedObjectId) return;

            const object = window.currentState?.objects?.find(item => item.id === selectedObjectId);
            if (!object || object.type !== "rectangle") return;

            const image = new Image();
            image.onload = () => {
                object.texture = path;
                object.aspectRatio = image.naturalWidth / image.naturalHeight;
                object.height = object.width / object.aspectRatio;
                renderState(window.currentState);

                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: "setAsset",
                        objectId: selectedObjectId,
                        path,
                        imageWidth: image.naturalWidth,
                        imageHeight: image.naturalHeight
                    }));
                }
            };
            image.src = path;
        }

        board.addEventListener("wheel", event => {
            event.preventDefault();

            const rect = board.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;
            const worldX = (mouseX - cameraX) / zoom;
            const worldY = (mouseY - cameraY) / zoom;

            const factor = Math.exp(-event.deltaY * 0.0015);
            const nextZoom = Math.max(0.25, Math.min(3, zoom * factor));

            cameraX = mouseX - worldX * nextZoom;
            cameraY = mouseY - worldY * nextZoom;
            zoom = nextZoom;
            updateCamera();
        }, { passive: false });

        board.addEventListener("pointerdown", event => {
            if (event.button !== 1) return;

            event.preventDefault();
            panning = {
                pointerId: event.pointerId,
                startClientX: event.clientX,
                startClientY: event.clientY,
                startCameraX: cameraX,
                startCameraY: cameraY
            };

            board.classList.add("panning");
            board.setPointerCapture(event.pointerId);
        });

        board.addEventListener("pointermove", event => {
            if (!panning || panning.pointerId !== event.pointerId) return;

            cameraX = panning.startCameraX + (event.clientX - panning.startClientX);
            cameraY = panning.startCameraY + (event.clientY - panning.startClientY);
            updateCamera();
        });

        function finishPan(event) {
            if (!panning || panning.pointerId !== event.pointerId) return;

            if (board.hasPointerCapture(panning.pointerId)) {
                board.releasePointerCapture(panning.pointerId);
            }

            panning = null;
            board.classList.remove("panning");
        }

        board.addEventListener("pointerup", finishPan);
        board.addEventListener("pointercancel", finishPan);
        board.addEventListener("contextmenu", event => event.preventDefault());
        window.addEventListener("resize", updateCamera);

        addRectangleButton.onclick = addRectangle;
        deleteRectangleButton.onclick = deleteSelectedRectangle;
        sendBackgroundButton.onclick = () => setSelectedLayer("background");
        sendForegroundButton.onclick = () => setSelectedLayer("foreground");
        saveBoardButton.onclick = saveBoard;

        function saveBoard() {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                setStatus("Cannot save — multiplayer not connected");
                return;
            }

            saveBoardButton.disabled = true;
            setStatus("Saving…");
            socket.send(JSON.stringify({ type: "save" }));
        }

        function connectToRoom(roomId) {
            const isDiscordActivity = window.location.hostname.endsWith(".discordsays.com");
            const baseUrl = isDiscordActivity
                ? (window.location.protocol === "https:" ? "wss:" : "ws:") + "//" + window.location.host + ACTIVITY_PROXY_PATH
                : DIRECT_WORKER_URL;

            const url = `${baseUrl}?room=${encodeURIComponent(roomId)}`;
            console.log("Connecting multiplayer WebSocket:", url);

            socket = new WebSocket(url);

            socket.addEventListener("open", () => {
                saveBoardButton.disabled = false;
                setStatus("Multiplayer connected");
            });

            socket.addEventListener("message", event => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === "saved") {
                        saveBoardButton.disabled = false;
                        setStatus("Board saved");
                    }

                    if (data.type === "saveError") {
                        saveBoardButton.disabled = false;
                        setStatus("Save failed");
                        console.error(data.message);
                    }

                    if (data.type === "state") {
                        const serverObjects = (data.state.objects || []).filter(object => object.type === "rectangle");
                        const localObjects = (window.currentState?.objects || []).filter(object => object.id.startsWith("local-"));
                        window.currentState = {
                            version: 3,
                            objects: [...serverObjects, ...localObjects]
                        };
                        renderState(window.currentState);
                    }

                    if (data.type === "objectAdded" && data.object?.type === "rectangle") {
                        const local = window.currentState?.objects?.find(object => object.id.startsWith("local-"));
                        if (local) {
                            local.id = data.object.id;
                            local.x = data.object.x;
                            local.y = data.object.y;
                            local.width = data.object.width;
                            local.height = data.object.height;
                            local.rotation = data.object.rotation || 0;
                        } else {
                            window.currentState.objects.push(data.object);
                        }
                        selectedObjectId = data.object.id;
                        renderState(window.currentState);
                    }

                    if (data.type === "asset") {
                        const object = window.currentState?.objects?.find(item => item.id === data.objectId);
                        if (object) {
                            object.texture = data.path;
                            object.aspectRatio = data.aspectRatio;
                            object.height = object.width / object.aspectRatio;
                            renderState(window.currentState);
                        }
                    }

                    if (data.type === "layer") {
                        const object = window.currentState?.objects?.find(item => item.id === data.objectId);
                        if (object) {
                            object.layer = data.layer === "background" ? "background" : "foreground";
                            renderState(window.currentState);
                        }
                    }

                    if (data.type === "lock") {
                        const object = window.currentState?.objects?.find(item => item.id === data.objectId);
                        if (object) {
                            object.locked = Boolean(data.locked);
                            renderState(window.currentState);
                        }
                    }

                    if (data.type === "rotate") {
                        const object = window.currentState?.objects?.find(item => item.id === data.objectId);
                        if (object) {
                            object.rotation = Number(data.rotation) || 0;
                            const element = document.querySelector(`.object[data-object="${data.objectId}"]`);
                            if (element) {
                                element.style.transform = `translate(-50%, -50%) rotate(${object.rotation}deg)`;
                            }
                        }
                    }

                    if (data.type === "resize") {
                        const object = window.currentState?.objects?.find(item => item.id === data.objectId);
                        if (object) {
                            object.width = data.width;
                            object.height = data.height;

                            if (!resizingObject || resizingObject.object.id !== data.objectId) {
                                renderState(window.currentState);
                            }
                        }
                    }

                    if (data.type === "deleted") {
                        window.currentState.objects = (window.currentState.objects || []).filter(object => object.id !== data.objectId);
                        if (selectedObjectId === data.objectId) {
                            selectedObjectId = null;
                        }
                        renderState(window.currentState);
                    }

                    if (data.type === "move") {
                        const object = window.currentState?.objects?.find(item => item.id === data.objectId);
                        if (object) {
                            object.x = data.x;
                            object.y = data.y;
                        }
                        const element = document.querySelector(`.object[data-object="${data.objectId}"]`);
                        if (element) {
                            element.style.left = `${data.x}%`;
                            element.style.top = `${data.y}%`;
                        }
                    }
                } catch (error) {
                    console.error("Invalid server message", error);
                }
            });

            socket.addEventListener("close", event => {
                saveBoardButton.disabled = true;
                console.warn("WebSocket closed", event.code, event.reason);
                setStatus(`Disconnected (${event.code}) — retrying…`);
                setTimeout(() => connectToRoom(roomId), 1500);
            });

            socket.addEventListener("error", event => {
                console.error("WebSocket connection error", event);
                setStatus("Connection error — check Activity URL mapping");
            });
        }

        async function setupDiscord() {
            try {
                const { DiscordSDK } = await import(
                    "https://unpkg.com/@discord/embedded-app-sdk@2.5.0/output/index.mjs"
                );

                const discordSdk = new DiscordSDK(CLIENT_ID);
                await discordSdk.ready();

                setStatus(`Discord connected (${discordSdk.instanceId})`);
                connectToRoom(discordSdk.instanceId);
            } catch (error) {
                console.warn("Discord SDK unavailable; using local test mode.", error);
                setStatus("Local test mode");
            }
        }

        centerWorld();
        loadAssets();
        setupDiscord();
    </script>
</body>
</html>
