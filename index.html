<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabletop</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #202225;
            font-family: Arial, sans-serif;
        }

        #status {
            position: fixed;
            z-index: 100;
            top: 10px;
            left: 10px;
            padding: 6px 10px;
            border-radius: 6px;
            background: rgba(0,0,0,.65);
            color: white;
            font-size: 13px;
            pointer-events: none;
        }

        #board {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 40px),
                        repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 1px, transparent 1px 40px),
                        #35513f;
        }

        .object {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            user-select: none;
            touch-action: none;
            box-sizing: border-box;
        }

        .object:active {
            cursor: grabbing;
        }

        .object.selected {
            outline: 3px solid #fff;
            outline-offset: 3px;
        }

        #assets {
            position: fixed;
            z-index: 110;
            right: 10px;
            top: 10px;
            width: 220px;
            max-height: calc(100vh - 20px);
            overflow: auto;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 8px;
            background: rgba(0,0,0,.78);
            color: white;
        }

        #assets h3 {
            margin: 0 0 8px;
            font-size: 14px;
        }

        #assetHint {
            margin-bottom: 8px;
            font-size: 12px;
            opacity: .8;
        }

        .asset-folder {
            margin-top: 10px;
            font-size: 12px;
            opacity: .7;
        }

        .asset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 5px;
        }

        .asset {
            width: 100%;
            aspect-ratio: 1;
            padding: 0;
            border: 1px solid #555;
            border-radius: 4px;
            background: #333;
            overflow: hidden;
            cursor: pointer;
        }

        .asset img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .object.circle {
            border-radius: 50%;
            background: white;
            border: 3px solid #222;
            font-weight: bold;
        }

        .object.rectangle {
            background: #777;
            border: 3px solid #222;
        }

        .object.image {
            background: transparent;
        }

        .object.image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .object.text {
            color: white;
            background: rgba(0,0,0,.55);
            border: 2px solid #222;
            padding: 6px 10px;
            min-width: 40px;
            min-height: 24px;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div id="status">Connecting…</div>
    <div id="assets">
        <h3>Assets</h3>
        <div id="assetHint">Select a rectangle or image object, then click an asset.</div>
        <div id="assetList">Loading…</div>
    </div>
    <div id="board"></div>

    <script type="module">
        const CLIENT_ID = "1551720640329814118";
        const DIRECT_WORKER_URL = "wss://discord-tabletop.animeister86.workers.dev/websocket";
        const ACTIVITY_PROXY_PATH = "/sync/websocket";

        const status = document.getElementById("status");
        const board = document.getElementById("board");

        let socket = null;
        let draggingObject = null;
        let selectedObjectId = null;
        let lastSent = 0;

        const ASSET_FOLDERS = ["characters", "textures", "objects"];
        const IMAGE_EXTENSIONS = /\.(png|jpe?g|gif|webp|svg)$/i;

        function setStatus(text) {
            status.textContent = text;
        }

        function renderObject(object) {
            let element = document.querySelector(`.object[data-object="${object.id}"]`);

            if (!element) {
                element = document.createElement("div");
                element.className = "object";
                element.dataset.object = object.id;
                board.appendChild(element);
            }

            element.className = `object ${object.type}${selectedObjectId === object.id ? " selected" : ""}`;
            element.style.left = `${object.x}%`;
            element.style.top = `${object.y}%`;
            element.style.width = object.width ? `${object.width}px` : "";
            element.style.height = object.height ? `${object.height}px` : "";

            element.replaceChildren();
            element.style.backgroundImage = "";

            if (object.type === "circle") {
                element.textContent = object.text || object.id;
            }

            if (object.type === "rectangle") {
                if (object.texture) {
                    element.style.backgroundImage = `url("${object.texture}")`;
                    element.style.backgroundSize = "cover";
                    element.style.backgroundRepeat = "repeat";
                }
            }

            if (object.type === "image") {
                const image = document.createElement("img");
                image.src = object.image || "";
                image.alt = object.id;
                element.appendChild(image);
            }

            if (object.type === "text") {
                element.textContent = object.text || "";
            }

            attachDragHandlers(element, object.id);
        }

        function renderState(state) {
            const objects = state.objects || [];
            const ids = new Set(objects.map(object => object.id));

            for (const element of board.querySelectorAll(".object")) {
                if (!ids.has(element.dataset.object)) {
                    element.remove();
                }
            }

            for (const object of objects) {
                renderObject(object);
            }
        }

        function sendMove(id, x, y) {
            if (!socket || socket.readyState !== WebSocket.OPEN) return;

            socket.send(JSON.stringify({
                type: "move",
                objectId: id,
                x,
                y
            }));
        }

        function attachDragHandlers(element, objectId) {
            element.onpointerdown = event => {
                selectedObjectId = objectId;
                if (window.currentState) renderState(window.currentState);

                draggingObject = {
                    element,
                    pointerId: event.pointerId,
                    id: objectId
                };

                element.setPointerCapture(event.pointerId);
            };

            element.onpointermove = event => {
                if (!draggingObject || draggingObject.pointerId !== event.pointerId) return;

                const rect = board.getBoundingClientRect();
                const x = Math.max(0, Math.min(100, ((event.clientX - rect.left) / rect.width) * 100));
                const y = Math.max(0, Math.min(100, ((event.clientY - rect.top) / rect.height) * 100));

                element.style.left = `${x}%`;
                element.style.top = `${y}%`;

                const now = performance.now();
                if (now - lastSent >= 40) {
                    lastSent = now;
                    sendMove(objectId, x, y);
                }
            };

            element.onpointerup = event => {
                if (!draggingObject || draggingObject.pointerId !== event.pointerId) return;

                const rect = board.getBoundingClientRect();
                const x = Math.max(0, Math.min(100, ((event.clientX - rect.left) / rect.width) * 100));
                const y = Math.max(0, Math.min(100, ((event.clientY - rect.top) / rect.height) * 100));

                sendMove(objectId, x, y);
                draggingObject = null;
            };

            element.onpointercancel = () => {
                draggingObject = null;
            };
        }

        async function loadAssets() {
            const list = document.getElementById("assetList");
            list.textContent = "";

            for (const folder of ASSET_FOLDERS) {
                try {
                    const response = await fetch(
                        `https://api.github.com/repos/lookatmeseeks/Discord-Tabletop/contents/assets/${folder}`
                    );

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const files = (await response.json())
                        .filter(file => file.type === "file" && IMAGE_EXTENSIONS.test(file.name));

                    if (!files.length) continue;

                    const title = document.createElement("div");
                    title.className = "asset-folder";
                    title.textContent = folder;
                    list.appendChild(title);

                    const grid = document.createElement("div");
                    grid.className = "asset-grid";

                    for (const file of files) {
                        const button = document.createElement("button");
                        button.className = "asset";
                        button.title = file.name;
                        const image = document.createElement("img");
                        image.src = file.path;
                        image.alt = file.name;
                        button.appendChild(image);

                        button.onclick = () => applyAsset(file.path);
                        grid.appendChild(button);
                    }

                    list.appendChild(grid);
                } catch (error) {
                    console.warn("Could not load assets from", folder, error);
                }
            }

            if (!list.children.length) {
                list.textContent = "No images found in assets/.";
            }
        }

        function applyAsset(path) {
            if (!selectedObjectId || !socket || socket.readyState !== WebSocket.OPEN) return;

            socket.send(JSON.stringify({
                type: "setAsset",
                objectId: selectedObjectId,
                path
            }));
        }

        function connectToRoom(roomId) {
            const isDiscordActivity = window.location.hostname.endsWith(".discordsays.com");
            const baseUrl = isDiscordActivity
                ? (window.location.protocol === "https:" ? "wss:" : "ws:") + "//" + window.location.host + ACTIVITY_PROXY_PATH
                : DIRECT_WORKER_URL;

            const url = `${baseUrl}?room=${encodeURIComponent(roomId)}`;
            console.log("Connecting multiplayer WebSocket:", url);

            socket = new WebSocket(url);

            socket.addEventListener("open", () => {
                setStatus("Multiplayer connected");
            });

            socket.addEventListener("message", event => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === "state") {
                        window.currentState = data.state;
                        renderState(data.state);
                    }

                    if (data.type === "asset") {
                        const object = window.currentState?.objects?.find(item => item.id === data.objectId);
                        if (object) {
                            if (data.assetType === "texture") object.texture = data.path;
                            if (data.assetType === "image") object.image = data.path;
                            renderState(window.currentState);
                        }
                    }

                    if (data.type === "move") {
                        const element = document.querySelector(`.object[data-object="${data.objectId}"]`);
                        if (element) {
                            element.style.left = `${data.x}%`;
                            element.style.top = `${data.y}%`;
                        }
                    }
                } catch (error) {
                    console.error("Invalid server message", error);
                }
            });

            socket.addEventListener("close", event => {
                console.warn("WebSocket closed", event.code, event.reason);
                setStatus(`Disconnected (${event.code}) — retrying…`);
                setTimeout(() => connectToRoom(roomId), 1500);
            });

            socket.addEventListener("error", event => {
                console.error("WebSocket connection error", event);
                setStatus("Connection error — check Activity URL mapping");
            });
        }

        async function setupDiscord() {
            try {
                const { DiscordSDK } = await import(
                    "https://unpkg.com/@discord/embedded-app-sdk@2.5.0/output/index.mjs"
                );

                const discordSdk = new DiscordSDK(CLIENT_ID);
                await discordSdk.ready();

                setStatus(`Discord connected (${discordSdk.instanceId})`);
                connectToRoom(discordSdk.instanceId);
            } catch (error) {
                console.warn("Discord SDK unavailable; using local test mode.", error);
                setStatus("Local test mode");
            }
        }

        loadAssets();
        setupDiscord();
    </script>
</body>
</html>
